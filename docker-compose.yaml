
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: weather_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # only reachable from this machine not exposed to internet
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data  # <--- persistent volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5    

  init:
    container_name: weather_init
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DBT_MODE: local
      DBT_BIN: /opt/dbt-venv/bin/dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    restart: "no"             # run once, then stop
    command: ["sh", "-c", "python -m scripts.initialiser && /opt/dbt-venv/bin/dbt run --select stations --project-dir dbt/weather_project --profiles-dir dbt"]
    depends_on:
      db:
        condition: service_healthy

  # scheduler:
  #   build: .
  #   container_name: weather_scheduler
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: db
  #     POSTGRES_PORT: "5432"
  #     DBT_MODE: local
  #     DBT_BIN: /opt/dbt-venv/bin/dbt
  #     DBT_TARGET_PATH: /tmp/dbt/target
  #     DBT_LOG_PATH: /tmp/dbt/logs
  #   volumes:
  #     - ./logs:/app/logs
  #   depends_on:
  #     db:
  #       condition: service_healthy

  api:
    build: .
    container_name: weather_api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: ["python", "-m", "api.main"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD-SHELL", "curl --fail http://localhost:80 || exit 1"]
    #   interval: 10s
    #   retries: 5
    #   start_period: 5s
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin


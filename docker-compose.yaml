
services:
  db:
    image: pikhovkin/postgresql-postgis-timescaledb:latest
    container_name: weather_db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # - ./data:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data  # <--- persistent volume

  pgadmin:
    image: dpage/pgadmin4
    # restart: always
    # healthcheck:
    #   test: ["CMD-SHELL", "curl --fail http://localhost:80 || exit 1"]
    #   interval: 10s
    #   retries: 5
    #   start_period: 5s
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.9
    container_name: dbt_runner
    env_file: .env
    ports:
    - "8081:8080"   # <--- expose container port to host
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  pgadmin_data:
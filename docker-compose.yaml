x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"

x-dbt-env: &dbt-env
  DBT_MODE: local
  DBT_BIN: /opt/dbt-venv/bin/dbt
  DBT_TARGET_PATH: /tmp/dbt/target
  DBT_LOG_PATH: /tmp/dbt/logs

x-api-env: &api-env
  DB_STATEMENT_TIMEOUT_MS: "30000"
  DB_POOL_MAX: "10"

services:
  db:
    image: timescale/timescaledb:2.31.0-pg16
    # container_name: weather_db
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  init:
    build: .
    # container_name: weather_init
    restart: "no"
    logging: *logging
    env_file: .env
    environment:
      <<: [*app-env, *dbt-env]
    command: ["sh", "-c", "python -m scripts.initialiser && /opt/dbt-venv/bin/dbt run --select stations --project-dir dbt/weather_project --profiles-dir dbt"]
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    # container_name: weather_scheduler
    restart: unless-stopped
    logging: *logging
    mem_limit: 6g            # GRIB processing is hungry; if it OOMs, only this container dies
    env_file: .env
    environment:
      <<: [*app-env, *dbt-env]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  api:
    build: .
    # container_name: weather_api
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    env_file: .env
    environment:
      <<: [*app-env, *api-env]
    command: ["uvicorn", "api.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    logging: *logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  frontend:
    profiles: ["prod"]
    build: ./frontend
    # container_name: weather_frontend
    restart: unless-stopped
    logging: *logging

  caddy:
    profiles: ["prod"]
    image: caddy:2
    # container_name: weather_caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - api
      - frontend

volumes:
  db_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
version: 2

sources:
  - name: bronze          # a logical name for the source
    database: "{{ env_var('POSTGRES_DB') }}"
    schema: bronze             # schema where bronze tables live
    tables:
      - name: observations
        description: "Raw ingestion table from MateoFrance paquet 6m API (the API that ingests the data of all available stations at a single timestep)"
      - name: stations
        description: "Table containing all the available stations for this API with their metadata"